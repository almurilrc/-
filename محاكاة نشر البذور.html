<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكاة نشر البذور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f1;--card:#fff;--ink:#1d3b2a;--mute:#5a7466;--acc:#2f7d4f;--line:#cfe0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14211a;--card:#1d2f24;--ink:#e6f2e9;--mute:#9bb5a4;--acc:#6fcf94;--line:#2f4a3a}}
:root[data-theme="dark"]{--bg:#14211a;--card:#1d2f24;--ink:#e6f2e9;--mute:#9bb5a4;--acc:#6fcf94;--line:#2f4a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
canvas{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line);background:#cfe8f5}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.chip{padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;cursor:pointer}.chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.go{padding:9px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #f2b632;outline-offset:2px}
.note{color:var(--mute);font-size:.92rem;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mute);font-weight:400}
</style>
</head>
<body>
<main>
<h1>كيف تنتشر البذور؟</h1>
<div class="tabs" role="tablist">
<button role="tab" data-m="wind" aria-selected="true">الرياح</button>
<button role="tab" data-m="water" aria-selected="false">الماء</button>
<button role="tab" data-m="burst" aria-selected="false">الانفجار</button>
</div>
<canvas id="cv" width="640" height="360" aria-label="محاكاة نشر البذور"></canvas>
<div class="panel">
<div class="row">
<label id="lbl" for="sl"></label>
<input id="sl" type="range">
<output id="val"></output>
</div>
<div class="row" id="types" style="margin-bottom:4px"></div>
<div class="row" style="margin-top:10px">
<button class="go" id="go"></button>
<button class="go alt" id="reset">إعادة</button>
</div>
<p class="note" id="note"></p>
</div>
<div class="panel" id="stats"></div>
</main>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=640,H=360;
var sl=document.getElementById('sl'),val=document.getElementById('val'),lbl=document.getElementById('lbl'),go=document.getElementById('go'),note=document.getElementById('note'),stats=document.getElementById('stats');
var sel='dand';var mode='wind',seeds=[],pods=[],t=0,landed={};
var GY=320,PX=70;
var WT=[
{k:'dand',n:'الهندباء',fall:.5,drag:.03,f:1.0},
{k:'maple',n:'القيقب',fall:.9,drag:.02,f:.8},
{k:'agap',n:'نبات الثريا',fall:1.1,drag:.015,f:.7},
{k:'poppy',n:'الخشخاش',fall:2.2,drag:.01,f:.5}];
var CFG={
wind:{lbl:'سرعة الرياح',min:0,max:10,v:5,unit:'',go:'أطلق البذور',note:'البذور الخفيفة أو ذات الأجنحة والزغب تطير أبعد. جرّب سرعات مختلفة وقارن المسافات. ثمرة الثريا تجف وتتدحرج وتُسقط بذورها، وثمرة الخشخاش تهتز فتتساقط بذورها من فتحاتها.'},
water:{lbl:'سرعة التيار',min:1,max:10,v:5,unit:'',go:'ألقِ البذور في الماء',note:'بذور جوز الهند والمانجروف تطفو لأنها تحتوي على طبقة تحميها من الماء وتجعلها خفيفة، أما البذرة الثقيلة فتغوص.'},
burst:{lbl:'درجة الحرارة',min:20,max:45,v:35,unit:'°م',go:'ابدأ التسخين',note:'عندما يجف قرن الفول في الطقس الحار ينفجر وتنطلق بذوره بعيدًا. في الجو البارد لا ينفجر.'}};
function rnd(a,b){return a+Math.random()*(b-a)}
function setMode(m){
mode=m;var c=CFG[m];
document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.m===m)});
sl.min=c.min;sl.max=c.max;sl.value=c.v;lbl.textContent=c.lbl;go.textContent=c.go;note.textContent=c.note;
upVal();reset();buildTypes();
}
function buildTypes(){var el=document.getElementById('types');el.style.display=mode==='wind'?'flex':'none';el.innerHTML='';WT.concat([{k:'all',n:'الكل'}]).forEach(function(w){var b=document.createElement('button');b.className='chip';b.textContent=w.n;b.setAttribute('aria-pressed',w.k===sel);b.onclick=function(){sel=w.k;seeds=[];rs();buildTypes()};el.appendChild(b)})}
function upVal(){val.textContent=sl.value+(CFG[mode].unit?' '+CFG[mode].unit:'')}
function reset(){
seeds=[];pods=[];t=0;landed={};rs();
if(mode==='burst'){for(var i=0;i<3;i++)pods.push({x:130+i*190,y:130+(i%2)*25,dry:0,open:false,run:false})}
renderStats();
}
function renderStats(){
var h='';
if(mode==='wind'){
h='<table><tr><th>البذرة</th><th>متوسط المسافة</th></tr>';
WT.forEach(function(w){var a=landed[w.k]||[];var s=a.length?(a.reduce(function(x,y){return x+y},0)/a.length).toFixed(1)+' م':'—';h+='<tr><td>'+w.n+'</td><td>'+s+'</td></tr>'});
h+='</table>';
}else if(mode==='water'){
var names={coco:'جوز الهند',mang:'المانجروف',rock:'بذرة ثقيلة'};
h='<table><tr><th>البذرة</th><th>النتيجة</th></tr>';
['coco','mang','rock'].forEach(function(k){h+='<tr><td>'+names[k]+'</td><td>'+(landed[k]||'—')+'</td></tr>'});
h+='</table>';
}else{
var d=landed.b||[];
h='<table><tr><th>عدد البذور المنطلقة</th><th>أبعد مسافة</th></tr><tr><td>'+d.length+'</td><td>'+(d.length?Math.max.apply(null,d).toFixed(1)+' م':'—')+'</td></tr></table>';
}
stats.innerHTML=h;
}
go.onclick=function(){
if(mode==='wind'){
WT.forEach(function(w){if(sel!=='all'&&w.k!==sel)return;if(w.k==='agap'){AG.dry=0;AG.det=false;AG.tum=null;AG.go=true;return}if(w.k==='poppy'){PP.on=1;PP.left=10;return}for(var i=0;i<(sel==='all'?4:6);i++)seeds.push({t:w,x:PX+rnd(-8,12),y:rnd(150,185),vx:0,a:rnd(0,6),ph:rnd(0,6),done:false})});
}else if(mode==='water'){
seeds=[];landed={};
[['coco',1,0],['mang',.8,1],['rock',.7,2]].forEach(function(s){seeds.push({k:s[0],f:s[1],x:30,y:150+s[2]*10,vy:0,done:false,ph:rnd(0,6)})});
}else{pods.forEach(function(p){p.run=true})}
renderStats();
};
document.getElementById('reset').onclick=reset;
sl.oninput=upVal;
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});

function sky(c1,c2){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function seedShape(k,x,y,a){
ctx.save();ctx.translate(x,y);
if(k==='dand'){ctx.strokeStyle='#fff';ctx.lineWidth=1;for(var i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(i*3,-9);ctx.stroke()}ctx.fillStyle='#6b4a2b';ctx.beginPath();ctx.arc(0,0,2,0,7);ctx.fill()}
else if(k==='maple'){ctx.rotate(a);ctx.fillStyle='#d9a45a';ctx.beginPath();ctx.ellipse(8,0,9,3.5,0,0,7);ctx.fill();ctx.fillStyle='#6b4a2b';ctx.beginPath();ctx.arc(0,0,2.6,0,7);ctx.fill()}
else if(k==='agap'){ctx.rotate(a*.3);ctx.fillStyle='#4a3524';ctx.beginPath();ctx.ellipse(0,0,4,2,0,0,7);ctx.fill()}
else{ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(0,0,2.5,0,7);ctx.fill()}
ctx.restore();
}
function plant(k,x,s){
ctx.save();ctx.translate(x,GY);ctx.scale(s,s);ctx.lineCap='round';
var G='#3f7d34';if(k==='poppy')ctx.rotate(PP.ang);
if(k==='dand'){
ctx.strokeStyle=G;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-148);ctx.stroke();
ctx.fillStyle=G;[-1,1].forEach(function(d){ctx.beginPath();ctx.ellipse(d*16,-8,16,4,d*-.4,0,7);ctx.fill()});
ctx.strokeStyle='#cfd8dc';ctx.lineWidth=1.2;for(var i=0;i<16;i++){var a=i/16*6.283;ctx.beginPath();ctx.moveTo(0,-155);ctx.lineTo(Math.cos(a)*17,-155+Math.sin(a)*17);ctx.stroke()}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-155,6,0,7);ctx.fill();
}else if(k==='maple'){
ctx.fillStyle='#6b4a2b';ctx.fillRect(-7,-125,14,125);
ctx.strokeStyle='#6b4a2b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-90);ctx.lineTo(-24,-125);ctx.moveTo(0,-95);ctx.lineTo(24,-125);ctx.stroke();
ctx.fillStyle='#c0562b';[[0,-155,40],[-30,-130,28],[30,-130,28]].forEach(function(c){ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill()});
ctx.fillStyle='#e0a860';[[-22,-112],[0,-118],[24,-110]].forEach(function(c){ctx.beginPath();ctx.ellipse(c[0],c[1],8,3,.6,0,7);ctx.fill()});
}else if(k==='agap'){
ctx.strokeStyle=G;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-140);ctx.stroke();
ctx.lineWidth=5;[-1,1].forEach(function(d){ctx.beginPath();ctx.moveTo(d*4,0);ctx.quadraticCurveTo(d*22,-30,d*34,-12);ctx.stroke()});
if(AG.det){ctx.restore();return}ctx.strokeStyle=mix(AG.dry);ctx.lineWidth=1.5;ctx.fillStyle=mix(AG.dry);
for(var j=0;j<11;j++){var b=-2.5+j/10*1.9+.0,dx=Math.cos(b+.65)*30,dy=Math.sin(b+.65)*30;ctx.beginPath();ctx.moveTo(0,-140);ctx.lineTo(dx*1.0,-140+dy);ctx.stroke();ctx.beginPath();ctx.ellipse(dx,-140+dy,3,5,b+.65+1.57,0,7);ctx.fill()}
}else{
ctx.strokeStyle=G;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-8,-70,0,-138);ctx.stroke();
ctx.fillStyle=G;ctx.beginPath();ctx.ellipse(-14,-14,14,4,.5,0,7);ctx.fill();
ctx.fillStyle='#a8c256';ctx.beginPath();ctx.ellipse(0,-152,10,14,0,0,7);ctx.fill();
ctx.fillStyle='#6b4a2b';ctx.fillRect(-11,-168,22,5);ctx.fillStyle='#333';[-6,0,6].forEach(function(d){ctx.beginPath();ctx.arc(d,-161,1.6,0,7);ctx.fill()});
}
ctx.restore();
}
function drawPlants(){
if(sel==='all'){['dand','maple','agap','poppy'].forEach(function(k,i){var x=PX-66+i*44;if(k==='agap'){AG.x0=x;AG.s=.7}if(k==='poppy'){PP.x=x;PP.s=.7}plant(k,x,.7)})}
else{AG.x0=PX;AG.s=1;PP.x=PX;PP.s=1;plant(sel,PX,1)}
}
var AG,PP;
function rs(){AG={dry:0,det:false,go:false,tum:null,x0:PX,s:1};PP={on:0,left:0,ang:0,x:PX,s:1}}
rs();
function mix(c){return 'rgb('+Math.round(90+48*c)+','+Math.round(150-44*c)+','+Math.round(60+7*c)+')'}
function special(){
var w=sl.value*.12;
if(PP.on){PP.on++;var A=Math.min(.3,w*.3);PP.ang=A*Math.sin(PP.on*.5)*(PP.on<300?1:Math.max(0,1-(PP.on-300)/40));
if(PP.left>0&&w>.05&&Math.random()<.12+w*.1){PP.left--;seeds.push({t:WT[3],x:PP.x+Math.sin(PP.ang)*158*PP.s,y:GY-Math.cos(PP.ang)*158*PP.s,vx:Math.cos(PP.on*.5)*A*10+w*.4,a:0,ph:0,done:false,x0:PP.x})}
if(PP.on>340){PP.on=0;PP.ang=0}}
if(AG.go&&!AG.det){AG.dry=Math.min(1,AG.dry+.012);if(AG.dry>=1){AG.det=true;var r=22*AG.s;AG.tum={x:AG.x0,y:GY-r-3,r:r,a:0,vx:0,n:6,k:0}}}
var T=AG.tum;
if(T){T.vx+=(w*1.8-T.vx)*.02;T.x+=T.vx;T.a+=T.vx/T.r;T.k++;
if(T.n>0&&T.k%28===0){T.n--;seeds.push({t:{k:'agap',fall:2.6,drag:0,f:0},x:T.x,y:T.y+T.r*.5,vx:T.vx*.3,a:0,ph:0,done:false,x0:AG.x0})}
if(T.x>W+40)AG.tum=null}
}
function drawTum(){var T=AG.tum;if(!T)return;ctx.save();ctx.translate(T.x,T.y);ctx.rotate(T.a);ctx.strokeStyle='#8a6a43';ctx.lineWidth=1.6;ctx.fillStyle='#6b4a2b';for(var i=0;i<14;i++){var a=i/14*6.283,c=Math.cos(a),s=Math.sin(a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(c*T.r*.85,s*T.r*.85);ctx.stroke();ctx.beginPath();ctx.ellipse(c*T.r*.9,s*T.r*.9,2.5,4,a+1.57,0,7);ctx.fill()}ctx.restore()}
function drawWind(){
sky('#8cc7ea','#dff0f7');
ctx.fillStyle='#7a5a3a';ctx.fillRect(0,GY,W,H-GY);
ctx.fillStyle='#5b9a3f';ctx.fillRect(0,GY-4,W,6);
special();drawPlants();drawTum();
ctx.fillStyle='#fff';ctx.font='11px Cairo,sans-serif';ctx.textAlign='center';
for(var m=5;m<=30;m+=5){var x=PX+m*20;if(x<W-10){ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(m+' م',x,GY+18)}}
var w=sl.value*.12;
ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;
for(var i=0;i<5;i++){var yy=50+i*30,xx=((t*w*3+i*140)%W);ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+20+w*12,yy);ctx.stroke()}
seeds.forEach(function(s){
if(!s.done){
s.vx+=(w*s.t.f-s.vx)*s.t.drag*3;
s.x+=s.vx;s.y+=s.t.fall;s.a+=s.t.k==='maple'?.35:.02;
if(s.t.k==='dand')s.x+=Math.sin(t*.05+s.ph)*.4;
if(s.y>=GY-2){s.y=GY-2;s.done=true;(landed[s.t.k]=landed[s.t.k]||[]).push(Math.max(0,(s.x-(s.x0||PX))/20));renderStats()}
if(s.x>W+20)s.done=true;
}
seedShape(s.t.k,s.x,s.y,s.a);
});
}
function drawWater(){
sky('#a9dcf0','#e8f6fb');
var SY=190,BX=540;
ctx.fillStyle='#2a8fb8';ctx.fillRect(0,SY,BX,H-SY);
ctx.fillStyle='#e3c98d';ctx.beginPath();ctx.moveTo(BX,H);ctx.lineTo(BX,SY+10);ctx.lineTo(BX+40,SY-10);ctx.lineTo(W,SY-10);ctx.lineTo(W,H);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();
for(var x=0;x<=BX;x+=8){var y=SY+Math.sin(x*.05+t*.06)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
var c=sl.value*.1;
seeds.forEach(function(s){
if(!s.done){
if(s.k==='rock'){s.vy+=.04;s.y+=s.vy;s.x+=c*.2;if(s.y>H-14){s.y=H-14;s.done=true;landed.rock='غاصت في القاع';renderStats()}}
else{
s.x+=c*s.f;
var target=SY-4+Math.sin(s.x*.05+t*.06)*3;
s.y+=(target-s.y)*.08;
if(s.x>=BX+30){s.done=true;s.y=SY-14;landed[s.k]='وصلت إلى الشاطئ وتنبت';renderStats()}
}}
ctx.save();ctx.translate(s.x,s.y);
if(s.k==='coco'){ctx.fillStyle='#6fa83c';ctx.beginPath();ctx.ellipse(0,0,13,10,0,0,7);ctx.fill();ctx.fillStyle='#e8e0c0';ctx.beginPath();ctx.ellipse(0,0,6,5,0,0,7);ctx.fill()}
else if(s.k==='mang'){ctx.rotate(-.5);ctx.fillStyle='#3d6b2f';ctx.beginPath();ctx.ellipse(0,0,12,3.5,0,0,7);ctx.fill()}
else{ctx.fillStyle='#555';ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill()}
ctx.restore();
if(s.done&&s.k!=='rock'){ctx.strokeStyle='#2f8a3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x,s.y+10);ctx.lineTo(s.x,s.y-6);ctx.stroke();ctx.fillStyle='#2f8a3a';ctx.beginPath();ctx.ellipse(s.x+5,s.y-6,5,2.5,-.5,0,7);ctx.fill()}
});
}
function drawBurst(){
sky('#ffe9b0','#fff6dc');
ctx.fillStyle='#8a6a43';ctx.fillRect(0,GY,W,H-GY);
ctx.strokeStyle='#4f7a34';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(20,100);ctx.lineTo(620,100);ctx.stroke();
var heat=(sl.value-20)/25;
ctx.fillStyle='rgba(255,140,40,'+(.15+heat*.4)+')';ctx.beginPath();ctx.arc(W-50,45,26+heat*10,0,7);ctx.fill();
ctx.fillStyle='#f5b324';ctx.beginPath();ctx.arc(W-50,45,20,0,7);ctx.fill();
pods.forEach(function(p){
if(p.run&&!p.open){p.dry+=heat*heat*.006;if(p.dry>=1){p.open=true;for(var i=0;i<4;i++)seeds.push({x:p.x+rnd(-8,8),y:p.y,vx:rnd(-4.5,4.5),vy:rnd(-5,-2),done:false,x0:p.x})}}
var d=Math.min(1,p.dry),r=Math.round(80+d*70),g=Math.round(160-d*70),b=Math.round(60-d*20);
ctx.strokeStyle='rgb('+r+','+g+','+b+')';ctx.lineWidth=11;ctx.lineCap='round';
ctx.beginPath();
if(!p.open){ctx.moveTo(p.x,p.y-20);ctx.lineTo(p.x+4,p.y+30)}
else{ctx.moveTo(p.x,p.y-20);ctx.quadraticCurveTo(p.x-18,p.y,p.x-24,p.y+30);ctx.moveTo(p.x,p.y-20);ctx.quadraticCurveTo(p.x+18,p.y,p.x+24,p.y+30)}
ctx.stroke();
if(!p.open){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(p.x-20,p.y+52,40,5);ctx.fillStyle='#c0392b';ctx.fillRect(p.x-20,p.y+52,40*d,5)}
});
seeds.forEach(function(s){
if(!s.done){s.vy+=.18;s.x+=s.vx;s.y+=s.vy;
if(s.y>=GY-4){s.y=GY-4;s.done=true;(landed.b=landed.b||[]).push(Math.abs(s.x-s.x0)/20);renderStats()}}
ctx.fillStyle='#8e1f1f';ctx.beginPath();ctx.ellipse(s.x,s.y,5,4,0,0,7);ctx.fill();
});
}
function loop(){
t++;
ctx.clearRect(0,0,W,H);
if(mode==='wind')drawWind();else if(mode==='water')drawWater();else drawBurst();
requestAnimationFrame(loop);
}
setMode('wind');loop();
</script>
</body>
</html>
